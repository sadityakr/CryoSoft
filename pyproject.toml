[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryosoft"
version = "0.1.0"
description = "Instrument-agnostic cryostat operating system"
requires-python = ">=3.11"
dependencies = [
    # Pinned, not a floor. PyQt6 6.11 segfaults the GUI suite on Linux/Python
    # 3.13 (SIGSEGV inside QtWidgets during teardown) and is the version the
    # README warns about for the Anaconda DLL conflict on Windows. 6.7.1 is the
    # version the setups actually run. Raise this deliberately, with a full
    # `make check` on every target platform, never by letting CI float.
    "PyQt6==6.7.1",
    "pyqtgraph>=0.13",
    "qtawesome>=1.3",
    "ruamel.yaml>=0.18",
    "h5py>=3.9",
    "numpy>=1.24",
    "pyvisa>=1.13",
    "pyserial>=3.5",
    "pymeasure>=0.11",
    "rtm2 @ git+https://github.com/hzdrinno/rtm2-python.git@v1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "mypy>=1.5",
    "import-linter>=2.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: marks tests that require physical instruments (deselect with '-m \"not hardware\"')",
]

[tool.setuptools.packages.find]
include = ["cryosoft*"]

# ── Ruff (linter) ─────────────────────────────────────────────────────────────
# Conservative rule set: real errors only (pyflakes F, syntax errors E9).
# No formatting/style enforcement — the goal is catching undefined names,
# unused imports, and broken code before the tests even run.
[tool.ruff]
target-version = "py311"
# .claude holds agent skills, including reference *templates* meant to be
# copied and filled in. A template legitimately carries unused imports that
# support the contract its docstrings document, so linting it as shipped code
# is a category error. The package itself is what `make lint` gates on.
extend-exclude = ["resources", "data", "notes", "directives", ".claude"]

[tool.ruff.lint]
select = ["F", "E9"]

# ── Mypy (type checker) ───────────────────────────────────────────────────────
# Basic mode for now (CLAUDE.md: "start with mypy basic"). Run via `make typecheck`;
# advisory, not part of the blocking `make check` gate yet.
[tool.mypy]
python_version = "3.11"
packages = ["cryosoft"]
ignore_missing_imports = true

# ── Import-linter (layer contracts) ───────────────────────────────────────────
# Machine-checked architecture boundaries. Run via `make contracts`.
# Each contract below freezes an existing boundary of the six-layer architecture
# (see CLAUDE.md §4 and GLOSSARY.md). If your change violates one of these, the
# fix is to route through the proper interface, not to edit the contract.
[tool.importlinter]
root_package = "cryosoft"

[[tool.importlinter.contracts]]
name = "C1: foundation modules (exceptions/decorators/logging/paths) import nothing from cryosoft"
type = "forbidden"
source_modules = [
    "cryosoft.core.exceptions",
    "cryosoft.core.decorators",
    "cryosoft.core.logging_config",
    "cryosoft.core.paths",
]
forbidden_modules = [
    "cryosoft.drivers",
    "cryosoft.virtual_instruments",
    "cryosoft.procedures",
    "cryosoft.gui",
    "cryosoft.main",
    "cryosoft.core.station",
    "cryosoft.core.orchestrator",
    "cryosoft.core.procedure",
    "cryosoft.core.data_manager",
]

[[tool.importlinter.contracts]]
name = "C2: drivers are leaves — they import only the foundation (plus pyvisa/stdlib)"
type = "forbidden"
source_modules = ["cryosoft.drivers"]
forbidden_modules = [
    "cryosoft.virtual_instruments",
    "cryosoft.procedures",
    "cryosoft.gui",
    "cryosoft.main",
    "cryosoft.core.station",
    "cryosoft.core.orchestrator",
    "cryosoft.core.procedure",
    "cryosoft.core.data_manager",
]

[[tool.importlinter.contracts]]
name = "C3: VIs never import drivers (drivers are injected by the Station) nor anything above"
type = "forbidden"
source_modules = ["cryosoft.virtual_instruments"]
forbidden_modules = [
    "cryosoft.drivers",
    "cryosoft.procedures",
    "cryosoft.gui",
    "cryosoft.main",
    "cryosoft.core.station",
    "cryosoft.core.orchestrator",
    "cryosoft.core.procedure",
    "cryosoft.core.data_manager",
]

[[tool.importlinter.contracts]]
name = "C4: the Station sits below the Orchestrator, procedures, and GUI"
type = "forbidden"
source_modules = ["cryosoft.core.station"]
forbidden_modules = [
    "cryosoft.core.orchestrator",
    "cryosoft.core.procedure",
    "cryosoft.core.data_manager",
    "cryosoft.procedures",
    "cryosoft.gui",
    "cryosoft.main",
]

[[tool.importlinter.contracts]]
name = "C5: the Orchestrator talks only to the Station (and the BaseProcedure interface)"
type = "forbidden"
source_modules = ["cryosoft.core.orchestrator"]
# The Station legitimately imports VI base classes (C4 allows it); chains that
# merely pass through the Station are not violations of this contract.
ignore_imports = ["cryosoft.core.station -> cryosoft.virtual_instruments.*"]
forbidden_modules = [
    "cryosoft.drivers",
    "cryosoft.virtual_instruments",
    "cryosoft.procedures",
    "cryosoft.gui",
    "cryosoft.main",
    "cryosoft.core.data_manager",
]

[[tool.importlinter.contracts]]
name = "C6: procedures are hardware-blind — no drivers, no VIs, no Orchestrator, no GUI"
type = "forbidden"
source_modules = ["cryosoft.procedures", "cryosoft.core.procedure", "cryosoft.core.operation"]
# Same pass-through exemption as C5: procedures may import the Station, and the
# Station's own VI imports do not make procedures hardware-aware.
ignore_imports = ["cryosoft.core.station -> cryosoft.virtual_instruments.*"]
forbidden_modules = [
    "cryosoft.drivers",
    "cryosoft.virtual_instruments",
    "cryosoft.core.orchestrator",
    "cryosoft.gui",
    "cryosoft.main",
]

[[tool.importlinter.contracts]]
name = "C7: the data manager is standalone (foundation + h5py/numpy only)"
type = "forbidden"
source_modules = ["cryosoft.core.data_manager"]
forbidden_modules = [
    "cryosoft.drivers",
    "cryosoft.virtual_instruments",
    "cryosoft.procedures",
    "cryosoft.gui",
    "cryosoft.main",
    "cryosoft.core.station",
    "cryosoft.core.orchestrator",
    "cryosoft.core.procedure",
]

[[tool.importlinter.contracts]]
name = "C8: the GUI never imports drivers or concrete VIs (virtual_instruments.base is the one allowed exception, for @monitored/@control discovery)"
type = "forbidden"
source_modules = ["cryosoft.gui"]
forbidden_modules = [
    "cryosoft.drivers",
    "cryosoft.virtual_instruments.magnet",
    "cryosoft.virtual_instruments.temperature",
    "cryosoft.virtual_instruments.measurement",
    "cryosoft.virtual_instruments.level",
]

[[tool.importlinter.contracts]]
name = "C9: nothing in cryosoft imports the troubleshoot toolbox (a leaf entry point, like main)"
type = "forbidden"
source_modules = [
    "cryosoft.core",
    "cryosoft.drivers",
    "cryosoft.virtual_instruments",
    "cryosoft.procedures",
    "cryosoft.gui",
    "cryosoft.main",
    "cryosoft.session",
]
forbidden_modules = ["cryosoft.troubleshoot"]

[[tool.importlinter.contracts]]
name = "C10: the troubleshoot toolbox talks to drivers and the Station's config helpers only — never to the Orchestrator, procedures, data manager, or GUI"
type = "forbidden"
source_modules = ["cryosoft.troubleshoot"]
# Same pass-through exemption as C5/C6: the Station's own VI imports do not
# make the troubleshoot package VI-aware.
ignore_imports = ["cryosoft.core.station -> cryosoft.virtual_instruments.*"]
forbidden_modules = [
    "cryosoft.core.orchestrator",
    "cryosoft.core.procedure",
    "cryosoft.core.data_manager",
    "cryosoft.procedures",
    "cryosoft.virtual_instruments",
    "cryosoft.gui",
    "cryosoft.main",
]

[[tool.importlinter.contracts]]
name = "C11: the session layer (L6) sits below the GUI — it imports core downward, never gui/main/drivers/VIs/procedures"
type = "forbidden"
source_modules = ["cryosoft.session"]
# Same pass-through exemption as C5/C6: the session layer reaches the Station
# and Orchestrator, whose own VI imports do not make it hardware-aware.
ignore_imports = ["cryosoft.core.station -> cryosoft.virtual_instruments.*"]
forbidden_modules = [
    "cryosoft.gui",
    "cryosoft.main",
    "cryosoft.drivers",
    "cryosoft.virtual_instruments",
    "cryosoft.procedures",
]

[[tool.importlinter.contracts]]
name = "C12: nothing below the GUI imports the session layer (only gui and main may)"
type = "forbidden"
source_modules = [
    "cryosoft.core",
    "cryosoft.drivers",
    "cryosoft.virtual_instruments",
    "cryosoft.procedures",
    "cryosoft.troubleshoot",
]
forbidden_modules = ["cryosoft.session"]

[[tool.importlinter.contracts]]
name = "C13: cryosoft.core.conditions is pure policy — stdlib only, nothing else in cryosoft"
type = "forbidden"
source_modules = ["cryosoft.core.conditions"]
forbidden_modules = [
    "cryosoft.drivers",
    "cryosoft.virtual_instruments",
    "cryosoft.procedures",
    "cryosoft.gui",
    "cryosoft.main",
    "cryosoft.core.station",
    "cryosoft.core.orchestrator",
    "cryosoft.core.plan",
    "cryosoft.core.data_manager",
]

[[tool.importlinter.contracts]]
name = "C14: cryosoft.core.availability is pure policy — stdlib only, nothing else in cryosoft"
type = "forbidden"
source_modules = ["cryosoft.core.availability"]
forbidden_modules = [
    "cryosoft.drivers",
    "cryosoft.virtual_instruments",
    "cryosoft.procedures",
    "cryosoft.gui",
    "cryosoft.main",
    "cryosoft.core.station",
    "cryosoft.core.orchestrator",
    "cryosoft.core.plan",
    "cryosoft.core.data_manager",
    "cryosoft.core.conditions",
]

[[tool.importlinter.contracts]]
name = "C15: cryosoft.core.trend_checks is pure policy — no Qt, no Station/Orchestrator, no drivers/VIs/procedures/GUI"
type = "forbidden"
source_modules = ["cryosoft.core.trend_checks"]
forbidden_modules = [
    "cryosoft.drivers",
    "cryosoft.virtual_instruments",
    "cryosoft.procedures",
    "cryosoft.gui",
    "cryosoft.main",
    "cryosoft.core.station",
    "cryosoft.core.orchestrator",
    "cryosoft.core.trend_check_runner",
    "cryosoft.core.plan",
    "cryosoft.core.data_manager",
]

[[tool.importlinter.contracts]]
name = "C16: cryosoft.core.events is a pure contract — stdlib only, nothing else in cryosoft"
type = "forbidden"
source_modules = ["cryosoft.core.events"]
forbidden_modules = [
    "cryosoft.drivers",
    "cryosoft.virtual_instruments",
    "cryosoft.procedures",
    "cryosoft.gui",
    "cryosoft.main",
    "cryosoft.core.station",
    "cryosoft.core.orchestrator",
    "cryosoft.core.plan",
    "cryosoft.core.data_manager",
]

[[tool.importlinter.contracts]]
name = "C17: the data reader is standalone — it imports only events/exceptions from cryosoft (plus h5py/numpy/stdlib), so an analysis process can import it alone"
type = "forbidden"
# The allowlist is exactly `cryosoft.core.events` and `cryosoft.core.exceptions`;
# everything else in the package is enumerated below, because import-linter only
# matches a forbidden module that is not an ancestor of the source (naming
# `cryosoft` or `cryosoft.core` here would silently match nothing). A core module
# added later is caught by test_l5_data_reader.py's import-allowlist test, which
# reads the module's own imports rather than a list that has to be maintained.
source_modules = ["cryosoft.core.data_reader"]
forbidden_modules = [
    "cryosoft.drivers",
    "cryosoft.virtual_instruments",
    "cryosoft.procedures",
    "cryosoft.gui",
    "cryosoft.main",
    "cryosoft.session",
    "cryosoft.troubleshoot",
    "cryosoft.core.availability",
    "cryosoft.core.conditions",
    "cryosoft.core.config_catalog",
    "cryosoft.core.data_manager",
    "cryosoft.core.decorators",
    "cryosoft.core.gates",
    "cryosoft.core.logging_config",
    "cryosoft.core.operation",
    "cryosoft.core.operational_status",
    "cryosoft.core.orchestrator",
    "cryosoft.core.paths",
    "cryosoft.core.plan",
    "cryosoft.core.procedure",
    "cryosoft.core.ramps",
    "cryosoft.core.run_buffer",
    "cryosoft.core.run_builder",
    "cryosoft.core.stall_detection",
    "cryosoft.core.station",
    "cryosoft.core.sweep_builder",
    "cryosoft.core.tiered_trend_logger",
    "cryosoft.core.trend_check_runner",
    "cryosoft.core.trend_checks",
    "cryosoft.core.trend_history",
]

[[tool.importlinter.contracts]]
name = "C18: the GUI holds neither the Station nor the Orchestrator — it builds from the StationInfo declaration and acts through the OrchestratorProxy"
type = "forbidden"
source_modules = ["cryosoft.gui"]
# Direct imports only: the GUI legitimately imports the Orchestrator, which
# sits directly on top of the Station, so every indirect chain runs through a
# layer that is SUPPOSED to hold one. What this contract forbids is a widget
# naming the Station module itself.
allow_indirect_imports = "True"
# import-linter counts an import inside `if TYPE_CHECKING:` like any other, so
# a contract alone cannot say "as a type, yes; at runtime, no". Every entry
# below is therefore paired with the conformance test
# `test_gui_imports_the_station_only_for_typing_or_config_helpers`, which is
# what actually enforces the distinction: each ignored import must be inside a
# type-checking guard, or be one of the two pure config-FILE helpers named
# there (`validate_config_dir`, `read_instrument_metadata` — neither takes a
# Station nor touches an instrument; they live in that module for historical
# reasons and moving them is a separate change). A gui module NOT listed here
# cannot import the Station at all, which is the property this contract keeps.
ignore_imports = [
    "cryosoft.gui.config_editor -> cryosoft.core.station",
    "cryosoft.gui.monitor_window -> cryosoft.core.station",
    "cryosoft.gui.operations_panel -> cryosoft.core.station",
    "cryosoft.gui.procedure_params_panel -> cryosoft.core.station",
    "cryosoft.gui.procedure_window -> cryosoft.core.station",
    "cryosoft.gui.queue_panel -> cryosoft.core.station",
    "cryosoft.gui.trends_quadrant -> cryosoft.core.station",
    # The state-machine ENUM, not the engine: MonitorWindow names
    # OrchestratorState's members to colour its status bar. Every other GUI
    # module now imports cryosoft.core.orchestrator_proxy instead, and this
    # last one goes when the state vocabulary moves into the contract.
    "cryosoft.gui.monitor_window -> cryosoft.core.orchestrator",
]
forbidden_modules = [
    "cryosoft.core.station",
    "cryosoft.core.orchestrator",
]
